[package]
name = "dotenvdotenc"
version = "0.0.0"
edition = "2021"
description = "dede: keep gitignored .env* files in sync with committed dotenvx-encrypted .env*.enc twins"
license = "MIT"

[[bin]]
name = "dotenvdotenc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
# secp256k1 ECIES as @dotenvx/primitives (eciesjs) does it: ECDH, HKDF-SHA256,
# AES-256-GCM with a 16-byte nonce. All pure Rust.
k256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.2", default-features = false }
getrandom = "0.4.3"
# The TypeScript and @dotenvx/primitives parse with JavaScript regular
# expressions; this engine follows ECMAScript's rules for them.
regress = { version = "0.12.0", default-features = false, features = ["std"] }
